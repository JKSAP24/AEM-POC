<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Status Table - jQuery Version</title>
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        text-align: center;
        padding: 20px;
      }
      table {
        width: 80%;
        margin: 20px auto;
        border-collapse: collapse;
        background: #fff;
        box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
        border-radius: 10px;
        overflow: hidden;
      }
      th,
      td {
        padding: 12px;
        text-align: left;
      }
      th {
        background-color: #0077cc;
        color: white;
      }
      tr:nth-child(even) {
        background-color: #f2f2f2;
      }
      tr:hover {
        background-color: #ddd;
      }
      a {
        color: #0077cc;
        text-decoration: none;
        font-weight: bold;
      }
      a:hover {
        text-decoration: underline;
      }
      button {
        background-color: #0077cc;
        color: white;
        border: none;
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        border-radius: 5px;
        margin-bottom: 20px;
      }
      button:hover {
        background-color: #005fa3;
      }
    </style>
  </head>
  <body>
    <h2>Job Status Table</h2>
    <button id="fetchBtn">Fetch Data</button>

    <table id="statusTable">
      <thead>
        <tr>
          <th>Filename</th>
          <th>Preview Modified By</th>
          <th>Publish Modified By</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <script>
      const postUrl = "https://admin.hlx.page/status/jksap24/aem-poc/main";
      const requestData = {
        paths: ["/*"],
        select: ["edit", "preview", "live"],
      };

      $("#fetchBtn").on("click", function () {
        $.ajax({
          url: postUrl,
          method: "POST",
          contentType: "application/json",
          data: JSON.stringify(requestData),
          success: function (postData) {
            const jobUrl = postData.links.self;

            // Polling or immediate fetch (depending on backend readiness)
            $.ajax({
              url: jobUrl,
              method: "GET",
              success: function (detailsData) {
                if (detailsData.data.phase === "completed") {
                  renderTable(detailsData.data.resources);
                } else {
                  console.warn(
                    "Job not completed yet. Phase:",
                    detailsData.data.phase
                  );
                  // Optionally add polling or refresh logic here
                }
              },
              error: function () {
                console.error("Failed to fetch job details");
              },
            });
          },
          error: function () {
            console.error("Failed to trigger job");
          },
        });
      });

      function renderTable(resources) {
        const $tbody = $("#statusTable tbody");
        $tbody.empty();

        $.each(resources, function (i, resource) {
          const $row = $("<tr>");

          const fileLink = $("<a>")
            .attr("href", resource.path)
            .attr("target", "_blank")
            .attr("title", resource.sourceLastModified || "N/A")
            .text(resource.sourceName || "N/A");

          $("<td>").append(fileLink).appendTo($row);
          $("<td>")
            .text(resource.previewLastModifiedBy || "N/A")
            .appendTo($row);
          $("<td>")
            .text(resource.publishLastModifiedBy || "N/A")
            .appendTo($row);

          $tbody.append($row);
        });
      }
    </script>
  </body>
</html>
