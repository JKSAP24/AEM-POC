      function getSelectedFileNames() {
          const url = window.location.href;

          if (url.includes("drive.google.com")) {
            console.log("Detected Google Drive");
            const rows = document.querySelectorAll('[role="row"][aria-selected="true"]');

            const fileNames = Array.from(rows).map(row => {
              const nameEl = row.querySelector('[data-tooltip]');
              const fallbackEl = row.querySelector('div[role="gridcell"] span[aria-label]');
              return nameEl?.getAttribute('data-tooltip') ||
                    fallbackEl?.getAttribute('aria-label') ||
                    'Unnamed file';
            });

            console.log('Google Drive - Selected File Names:', fileNames);
            return fileNames;

          } else if (url.includes("sharepoint.com")) {
            console.log("Detected SharePoint");

            const selectedRows = document.querySelectorAll('.ms-DetailsRow.is-selected');
            const fileNames = Array.from(selectedRows).map(row => {
              const cell = row.querySelector('.ms-DetailsRow-cell');
              return cell?.textContent.trim() || 'Unnamed file';
            });

            console.log('SharePoint - Selected File Names:', fileNames);
            return fileNames;

          } else {
            console.log("Platform not supported");
            return [];
          }
        }

      function startPollingJobDetails(url) {
        const maxAttempts = 5; // 5 attempts * 2s = 10 seconds
        let attemptCount = 0;

        function poll() {
          $.ajax({
            url: url,
            method: "GET",
            success: function (response) {
              const phase = response.data?.phase;
              console.log(`Polling #${attemptCount + 1}: phase = ${phase}`);
              if (phase === "completed") {
                renderTable(response.data.resources || []);
              } else if (attemptCount < maxAttempts - 1) {
                attemptCount++;
                setTimeout(poll, 2000);
              } else {
                $("#statusTable tbody").html(
                  '<tr><td colspan="3">Job did not complete in time.</td></tr>'
                );
              }
            },
            error: function () {
              if (attemptCount < maxAttempts - 1) {
                attemptCount++;
                setTimeout(poll, 2000);
              } else {
                $("#statusTable tbody").html(
                  '<tr><td colspan="3">Failed to fetch the data.</td></tr>'
                );
                console.error("Polling failed.");
              }
            },
          });
        }

        poll();
      }

      function renderTable(resources) {
        const $tbody = $("#statusTable tbody");
        $tbody.empty();

        if (!resources.length) {
          $tbody.append('<tr><td colspan="3">No resources found.</td></tr>');
          return;
        }

        resources.forEach((resource) => {
          const $row = $("<tr>");

          // Filename with title
          const fileLink = $("<a>")
            .attr("href", resource.path)
            .attr("target", "_blank")
            .attr("title", resource.sourceLastModified || "N/A")
            .text(resource.sourceName || resource.path || "N/A");

          $("<td>").append(fileLink).appendTo($row);

          // Preview Modified By with tooltip
          $("<td>")
            .text(resource.previewLastModifiedBy || "—")
            .attr(
              "title",
              `previewLastModified: ${
                resource.previewLastModified || "N/A"
              }\npreviewSourceLastModified: ${
                resource.previewSourceLastModified || "N/A"
              }`
            )
            .appendTo($row);

          // Publish Modified By with tooltip
          $("<td>")
            .text(resource.publishLastModifiedBy || "—")
            .attr(
              "title",
              `publishLastModified: ${
                resource.publishLastModified || "N/A"
              }\npublishSourceLastModified: ${
                resource.publishSourceLastModified || "N/A"
              }`
            )
            .appendTo($row);

          $tbody.append($row);
        });
      }
